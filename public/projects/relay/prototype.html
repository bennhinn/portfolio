.feature-hero{background:linear-gradient(125deg,#FCECE5,#EADFF2 48%,#DFEBE5);border:1px solid #fff9;box-shadow:7px 9px 18px #baa09b46,inset 0 2px 1px white;border-radius:28px;padding:18px 18px 20px;position:relative;overflow:hidden;margin-bottom:22px}

.wall-label{font-family:Georgia,serif;font-size:15px}
.screen-only{background:radial-gradient(circle at 15% 20%,#F4D5DC,transparent 36%),radial-gradient(circle at 85% 60%,#CFE3D6,transparent 34%),linear-gradient(135deg,#F9E9E3,#E7EEE7)}

function ico(n,cls=''){return `<svg class="i material-icon ${cls}" aria-hidden="true" viewBox="0 0 24 24">${svg[n]||svg.heart}</svg>`}
function logo(small=false){return `<span class="${small?'mini-logo':'logo'}"><span class="logo-mark"><svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M8 17C8 10.5 12.6 7 18.4 7c4.5 0 8.6 2.9 8.6 7.5 0 6-6.4 7-10 9.2l-4.1 3.3" stroke="currentColor" stroke-width="3.8" stroke-linecap="round"/><path d="M8 16.7v13" stroke="currentColor" stroke-width="3.8" stroke-linecap="round"/><path d="M15.8 25.4c1.5 0 3-1.3 4.6-1.3 2 0 3.1 1.3 4.7 1.3" stroke="#D9ECCF" stroke-width="3.2" stroke-linecap="round"/></svg></span><span>relay<span style="color:#84a48a">.</span></span></span>`}
const PAGES=[{id:'welcome',title:'Welcome',group:'Getting started',desc:'Gentle, reassuring first impression'},{id:'setup',title:'Create your circle',group:'Getting started',desc:'Name the family or care circle'},{id:'invite',title:'Invite your people',group:'Getting started',desc:'Granular roles and private invitations'},{id:'home',title:'Family home',group:'Everyday care',desc:'A calm and welcoming shared overview'},{id:'calendar',title:'Shared calendar',group:'Everyday care',desc:'Appointments and important moments'},{id:'tasks',title:'Care tasks',group:'Everyday care',desc:'Shared responsibility without pressure'},{id:'taskDetail',title:'Task details',group:'Everyday care',desc:'Clear ownership and gentle reminders'},{id:'checkin',title:'Check-ins',group:'Connection',desc:'A little emotional care goes a long way'},{id:'updates',title:'Family updates',group:'Connection',desc:'Warm, intentional family communication'},{id:'circle',title:'Our circle',group:'Connection',desc:'Inclusive family and caregiver relationships'},{id:'member',title:'Member profile',group:'Connection',desc:'Important context and contact preferences'},{id:'documents',title:'Shared documents',group:'Trust & safety',desc:'Clear visibility for sensitive records'},{id:'emergency',title:'Emergency hub',group:'Trust & safety',desc:'Critical details, only when needed'},{id:'privacy',title:'Privacy & sharing',group:'Trust & safety',desc:'Visible control and consent'},{id:'notifications',title:'Notifications',group:'Your account',desc:'Relevant, supportive reminders'},{id:'profile',title:'Your settings',group:'Your account',desc:'Comfort and preferences across generations'},{id:'empty',title:'Empty states',group:'Your account',desc:'Friendly messages, no blame'}];
const findPage=id=>PAGES.find(p=>p.id===id)||PAGES[0];
const names=[{name:'Mum',initials:'MW',cls:'mom',role:'Family member'},{name:'Dad',initials:'JO',cls:'dad',role:'Family member'},{name:'Joy',initials:'JA',cls:'lee',role:'Care coordinator'},{name:'Nan',initials:'NW',cls:'nan',role:'Family member'}];
const av=(n,cls)=>`<span class="persona ${cls}">${n}</span>`;
const btn=(txt,go='home',variant='primary',extra='')=>`<button class="${variant} ${extra}" data-go="${go}">${txt} ${ico('arrow','tiny')}</button>`;
const topHeader=(title='',back='home')=>`<div class="heading-row"><button class="back" data-go="${back}" aria-label="Back">${ico('back')}</button><h1>${title}</h1></div>`;
const sect=(title,to='',label='See all')=>`<div class="sectionline"><h3>${title}</h3>${to?`<button class="link-btn" data-go="${to}">${label} ${ico('chevron','tiny')}</button>`:''}</div>`;
const tile=(icon,color='')=>`<span class="icon-tile ${color}">${ico(icon)}</span>`;
const status=()=>`<div class="statusbar"><span>9:41</span><svg viewBox="0 0 56 13" fill="currentColor"><rect x="2" y="7" width="4" height="5" rx="1"/><rect x="9" y="5" width="4" height="7" rx="1"/><rect x="16" y="3" width="4" height="9" rx="1"/><rect x="23" y="1" width="4" height="11" rx="1"/><path d="M32 5q6-6 12 0M35 8q3-3 6 0" stroke="currentColor" fill="none" stroke-width="1.8"/><rect x="47" y="3" width="8" height="8" rx="2"/></svg></div>`;
let nav=active=>`<nav class="app-nav" aria-label="App navigation">${[['home','home','Home'],['calendar','calendar','Plans'],['circle','users','Circle'],['profile','user','You']].map(x=>`<button class="nav-item ${active===x[0]?'selected':''}" data-go="${x[0]}" aria-label="${x[2]}"><span class="nav-ic">${ico(x[1])}</span><span>${x[2]}</span></button>`).join('')}</nav>`;
const eventCard=(icon,title,desc,color,where)=>`<button class="soft-card row between" data-go="${where}" style="width:100%;text-align:left;border:1px solid #f2f0e8;margin-bottom:10px"><span class="row" style="gap:10px">${tile(icon,color)}<span class="grow"><span class="bold" style="display:block;font-size:13px">${title}</span><span class="muted" style="display:block;margin-top:5px;font-size:11px">${desc}</span></span></span>${ico('chevron')}</button>`;
const tcard=(id,title,meta)=>`<div class="task-card ${S.taskCompleted[id]?'done':''}"><button class="check ${S.taskCompleted[id]?'checked':''}" data-action="toggle-task" data-task="${id}" aria-label="Mark ${title} ${S.taskCompleted[id]?'incomplete':'complete'}">${S.taskCompleted[id]?ico('check'):''}</button><div class="task-main" role="button" tabindex="0" data-go="taskDetail"><div class="task-title">${title}</div><div class="task-detail">${meta}</div></div><button class="chevron-btn" data-go="taskDetail" aria-label="View task">${ico('chevron')}</button></div>`;
function viewWelcome(){return `<div class="screen" style="padding-top:26px">${logo(true)}<div class="welcome-art"><span class="heart-float">${ico('heart','large')}</span><div class="family-illustration" aria-hidden="true"><span class="person"></span><span class="person"></span><span class="person"></span></div><div class="art-note">${ico('heart','tiny')} care comes around</div></div><span class="eyebrow">WELCOME TO A CALMER WAY TO CARE</span><h1 class="screen-title" style="font-size:35px;line-height:1.1;margin:14px 0">A little care.<br><span style="color:#62896b">A lot of together.</span></h1><p class="screen-lede">Bring your family closer, keep the little details in one place, and make caring feel lighter.</p>${btn('Get started','setup','primary full')}<p class="fineprint text-center" style="margin-top:19px">Private by design · Built for every kind of family</p></div>`}
function viewSetup(){return `<div class="screen">${topHeader('Create your circle','welcome')}<div class="big-graphic" style="height:104px;width:104px;border-radius:32px;margin:13px auto 27px">${ico('users','large')}</div><span class="eyebrow">STEP 1 OF 2</span><h1 class="screen-title">What should we call your circle?</h1><p class="screen-lede">It might be your family, relatives, neighbours or a small group supporting someone you love.</p><div class="field"><label for="circle-name">Circle name</label><input id="circle-name" class="input" placeholder="e.g. Our home crew" value="The Wanjiku family" autocomplete="off"></div><div class="note-banner" style="margin:21px 0">${ico('shield','tiny')} Only invited members can join. You can change who sees each update later.</div>${btn('Continue to invitations','invite','primary full')}<button class="link-btn" style="display:block;margin:19px auto" data-go="home">Explore the demo instead</button></div>`}
function viewInvite(){return `<div class="screen">${topHeader('Invite your people','setup')}<span class="eyebrow">STEP 2 OF 2</span><h1 class="screen-title">Better together.</h1><p class="screen-lede">Invite only people you trust. Each person sees what their role and your sharing preferences allow.</p><div class="soft-card"><div class="field" style="margin-top:0"><label for="invite-email">Email or phone</label><input id="invite-email" class="input" placeholder="name@example.com" autocomplete="off"></div><div class="field"><label for="invite-role">Their role</label><select id="invite-role" class="input"><option>Family member</option><option>Care coordinator</option><option>Trusted caregiver</option><option>View-only guest</option></select></div><button class="primary full" data-action="invite">${ico('mail','tiny')} Send invitation</button></div>${sect('People in your circle')}<div class="soft-card"><div class="row between">${av('JW','you')}<div class="grow"><div class="bold">You</div><div class="muted">Circle owner</div></div><span class="chip">Admin</span></div>${S.inviteStatus?`<hr class="soft-divider"><div class="row">${av(ico('mail','tiny'),'lee')}<div class="grow"><div class="bold">Invitation pending</div><div class="muted">Awaiting acceptance</div></div><span class="chip lav">Pending</span></div>`:''}</div><p class="fineprint" style="margin:19px 0">Nobody is automatically granted access to private health, financial or emergency details.</p>${btn('Go to your family home','home','secondary full')}</div>`}
function viewHome(){return `<div class="screen"><div class="a-top">${logo(true)}<button class="circle-btn has-dot" data-go="notifications" aria-label="Notifications">${ico('bell')}</button></div><span class="eyebrow">SUNDAY, 18 OCTOBER</span><h1 class="screen-title">Good evening <span style="font-size:25px">${ico('sun','sun-accent')}</span></h1><p class="screen-lede" style="margin-bottom:21px">A little care goes a long way.</p><div class="circle-card"><div class="row between"><div><div class="smallstrong">Your family circle</div><h3>The Wanjiku family</h3></div><button class="circle-btn" data-go="circle" aria-label="Family members">${ico('users')}</button></div><div class="row between" style="margin:19px 0 12px"><span class="avatarline">${av('MW','mom')}${av('JO','dad')}${av('JA','lee')}${av('NW','nan')}</span><span class="chip white">4 connected</span></div><p class="muted" style="margin:0;color:#5c7961">Right where you belong, with the people who care.</p></div>${sect("Today's care",'tasks')}${tcard('medicine',"Mum's appointment",'Tomorrow · 10:00 AM · Joy coordinating')}${tcard('groceries','Weekly grocery pickup','Today · Assigned to Dad')}<div class="meter-label"><span>Care tasks this week</span><strong>${(Object.values(S.taskCompleted).filter(Boolean).length)} of 4 done</strong></div><div class="progress"><span style="width:${Object.values(S.taskCompleted).filter(Boolean).length*25}%"></span></div>${sect('Keep in touch','checkin','Check in')}
<div class="soft-card tint peach"><div class="row"><span class="icon-tile peach">${ico('heart')}</span><div class="grow"><div class="bold">How is everyone doing?</div><div class="muted">Even a short hello can make a difference.</div></div></div><button class="secondary full" style="margin-top:13px;background:#fffdfa;border:0" data-go="checkin">Send a thoughtful check-in ${ico('arrow','tiny')}</button></div><div class="quiet-banner">Your circle is a private space. You choose what you share.</div></div>`}
function viewCalendar(){return `<div class="screen"><div class="a-top"><h1 style="font-size:23px;margin:0">Family calendar</h1><button class="circle-btn" data-action="add-event" aria-label="Add calendar event">${ico('plus')}</button></div><p class="screen-lede">One place for important days, for everyone.</p><div class="row between" style="margin:14px 0 10px"><h2 style="font-size:20px;margin:0;letter-spacing:-.5px">October 2026</h2><div class="row"><button class="circle-btn" style="width:32px;height:32px" data-action="prev-month" aria-label="Previous month">${ico('back','tiny')}</button><button class="circle-btn" style="width:32px;height:32px" data-action="next-month" aria-label="Next month">${ico('chevron','tiny')}</button></div></div><div class="soft-card"><div class="calendar-grid">${['M','T','W','T','F','S','S'].map(x=>`<span class="calcell day">${x}</span>`).join('')}${Array.from({length:3},()=>`<span class="calcell"></span>`).join('')}${Array.from({length:31},(_,i)=>`<button data-action="choose-day" data-day="${i+1}" class="calcell ${i+1===S.calendarDay?'active':(i===17||i===18||i===23)?'has':''}" style="border:0">${i+1}</button>`).join('')}</div><div class="note-banner" style="background:#f3f6ef">${ico('calendar','tiny')} Selected: ${S.calendarDay} October. Your shared events are visible to circle members you've allowed.</div></div>${sect('Coming up')}
<div class="timeline"><div class="timeline-card"><span class="eyebrow">19 OCT · 10:00 AM</span><div class="bold" style="margin:6px 0">Mum's clinic appointment</div><div class="muted">Joy is coordinating · Family-only</div></div><div class="timeline-card"><span class="eyebrow">24 OCT · ALL DAY</span><div class="bold" style="margin:6px 0">Grandma's birthday ${ico('cake','tiny')}</div><div class="muted">Everyone in the circle</div></div><div class="timeline-card"><span class="eyebrow">28 OCT · 2:00 PM</span><div class="bold" style="margin:6px 0">Family catch-up call</div><div class="muted">Online · 4 invited</div></div></div></div>`}
function viewTasks(){const all=[['medicine',"Mum's appointment",'Tomorrow · 10:00 AM · Joy'],['groceries','Weekly grocery pickup','Today · Dad'],['forms','Fill insurance renewal','Thursday · You'],['call','Call grandma','Completed · Yesterday']].filter(x=>S.filter==='All'||(S.filter==='Done'?S.taskCompleted[x[0]]:!S.taskCompleted[x[0]]));return `<div class="screen"><div class="a-top"><h1 style="font-size:23px;margin:0">Care tasks</h1><button class="circle-btn" data-action="add-task" aria-label="Add care task">${ico('plus')}</button></div><p class="screen-lede">Little responsibilities, shared with love.</p><div class="soft-card tint"><div class="row between"><div><div class="eyebrow">THIS WEEK</div><div style="font-size:27px;font-weight:900;color:var(--pine);margin-top:6px">${Object.values(S.taskCompleted).filter(Boolean).length} / 4 <span class="small">complete</span></div></div>${tile('checkcircle')}</div><div class="progress" style="margin-top:15px"><span style="width:${Object.values(S.taskCompleted).filter(Boolean).length*25}%"></span></div></div><div class="seg">${['All','To do','Done'].map(x=>`<button class="${S.filter===x?'selected':''}" data-action="filter-tasks" data-filter="${x}">${x}</button>`).join('')}</div>${sect('Our shared to-dos')}${all.map(x=>tcard(...x)).join('')||`<div class="soft-card centered">${ico('checkcircle','large')}<p>No tasks here. Your circle is all caught up.</p></div>`}${S.taskAdded?`<div class="task-card">${tile('check','cream')}<div class="task-main"><div class="task-title">Your newly added care task</div><div class="task-detail">Just now · Demo item</div></div></div>`:''}<div class="note-banner" style="margin-top:16px">${ico('heart','tiny')} People need support, not a performance score. Gentle reminders by default.</div></div>`}
function viewTaskDetail(){return `<div class="screen">${topHeader('Task details','tasks')}<div class="soft-card tint lav" style="margin-top:21px"><span class="chip lav">Upcoming</span><h2 style="font-size:25px;line-height:1.18;margin:15px 0 9px">Mum's appointment</h2><p class="muted">A little coordination makes the day easier.</p><div class="row" style="margin-top:18px">${tile('calendar','lav')}<div class="grow"><div class="bold">Monday, 19 October</div><div class="muted">10:00 AM – 11:00 AM</div></div></div></div>${sect('Coordination details')}<div class="soft-card"><div class="row">${av('JA','lee')}<div class="grow"><div class="bold">Joy</div><div class="muted">Coordinating this appointment</div></div><span class="chip">Assigned</span></div><hr class="soft-divider"><div class="row">${tile('map')}<div class="grow"><div class="bold">Clinic visit</div><div class="muted">Venue shared with invited caregivers only</div></div></div><hr class="soft-divider"><div class="row">${tile('shield','lav')}<div class="grow"><div class="bold">Visibility: Care group</div><div class="muted">Not shared with the whole circle</div></div></div></div>${sect('Helpful notes')}<div class="soft-card"><p class="muted" style="margin:0;line-height:1.8">Bring any appointment documents needed. Confirm transport the evening before.</p></div><button class="primary full" style="margin-top:23px" data-action="toggle-task" data-task="medicine">${ico('check','tiny')} ${S.taskCompleted.medicine?'Mark as still needed':'Mark as completed'}</button><button class="link-btn" style="display:block;margin:12px auto" data-go="privacy">Review who can see this</button></div>`}
function viewCheckin(){return `<div class="screen">${topHeader('A little check-in','home')}<div class="big-graphic" style="margin:12px auto 24px">${ico('heart','large')}</div><h1 class="screen-title text-center">How's your heart today?</h1><p class="screen-lede text-center">Share a little, or simply say you're thinking of someone.</p><div class="screen-grid-2" style="grid-template-columns:repeat(3,1fr)">${[['sun','Doing well'],['partly_cloudy_day','Okay today'],['cloud','Could use care']].map((x,i)=>`<button data-action="mood" data-mood="${x[1]}" class="quick-tile" style="text-align:center;border:1px solid #e8eae2"><div class="mood-symbol">${ico(x[0],'mood-glyph')}</div><span style="font-size:11px;font-weight:850;color:#4c6450">${x[1]}</span></button>`).join('')}</div><div class="field" style="margin-top:25px"><label for="checkin-note">Want to add a note? (Optional)</label><textarea id="checkin-note" class="input" placeholder="Thinking of you today…"></textarea></div><div class="field"><label for="checkin-audience">Who can see this?</label><select id="checkin-audience" class="input"><option>My whole family circle</option><option>Care coordinators only</option><option>Only me (private journal)</option></select></div>${S.checkinStatus?`<div class="note-banner" style="margin-bottom:12px">${ico('check','tiny')} Check-in saved in this demo.</div>`:''}<button class="primary full" data-action="send-checkin">${ico('heart','tiny')} Save this check-in</button><p class="fineprint text-center" style="margin-top:16px">You can always choose not to share. No streaks or pressure.</p></div>`}
function viewUpdates(){return `<div class="screen"><div class="a-top"><h1 style="font-size:23px;margin:0">Family updates</h1><button class="circle-btn" data-action="add-update" aria-label="Create update">${ico('plus')}</button></div><p class="screen-lede">The thoughtful little moments that bring us closer.</p><div class="soft-card tint peach"><div class="row">${av('NW','nan')}<div class="grow"><div class="bold">Grandma Wanjiku</div><div class="muted">Yesterday · Shared with family</div></div>${ico('dots')}</div><p class="care-quote" style="margin:20px 2px">“The garden's finally blooming again. Wish you could all see it.” ${ico('flower','tiny')}</p><div class="row between"><span class="chip white">${ico('heart','tiny')} 3 warm reactions</span><button class="link-btn" data-action="react">Send some love ${ico('heart','tiny')}</button></div></div><div class="soft-card" style="margin-top:13px"><div class="row">${av('JO','dad')}<div class="grow"><div class="bold">Dad</div><div class="muted">Thursday · Care circle</div></div>${ico('dots')}</div><p style="line-height:1.65;font-size:13px">Picked up the groceries. Everything is sorted for the weekend.</p><span class="chip">${ico('check','tiny')} Thanks for helping</span></div>${sect('A little reminder')}<div class="note-banner">Share with intention, not by default. Every update has its own audience.</div></div>`}
function viewCircle(){return `<div class="screen"><div class="a-top"><h1 style="font-size:23px;margin:0">Our circle</h1><button class="circle-btn" data-go="invite" aria-label="Invite members">${ico('plus')}</button></div><p class="screen-lede">Care looks different in every family. Everyone has a place.</p><div class="circle-card" style="margin-bottom:22px"><div class="row between"><div><div class="eyebrow">CIRCLE</div><h3 style="margin:8px 0">The Wanjiku family</h3></div>${tile('users')}</div><div class="avatarline" style="margin-top:19px">${av('MW','mom')}${av('JO','dad')}${av('JA','lee')}${av('NW','nan')}</div></div>${sect('People in your circle','invite','Invite')}${names.map(x=>`<button class="soft-card row" style="width:100%;text-align:left;margin-bottom:10px" data-go="member">${av(x.initials,x.cls)}<span class="grow"><span class="bold" style="display:block;font-size:13px">${x.name}</span><span class="muted">${x.role}</span></span>${ico('chevron')}</button>`).join('')}<div class="note-banner" style="margin-top:18px">${ico('shield','tiny')} Relationship labels are flexible. No one has access to sensitive details simply because they are a family member.</div></div>`}
function viewMember(){return `<div class="screen">${topHeader('Family member','circle')}<div class="centered" style="margin:24px 0">${av('MW','mom')}<h1 class="screen-title" style="margin-top:13px">Mum</h1><span class="chip">Family member</span></div><div class="soft-card"><div class="row between"><div><div class="muted">Contact preference</div><div class="bold" style="margin-top:4px">Phone call</div></div>${tile('phone')}</div><hr class="soft-divider"><div class="row between"><div><div class="muted">Shared with you</div><div class="bold" style="margin-top:4px">Appointments & check-ins</div></div>${tile('shield','lav')}</div></div>${sect('Care and coordination')}<div class="soft-card tint"><div class="row">${tile('heart')}<div class="grow"><div class="bold">Care, on their terms</div><div class="muted">Preferences set by the member or authorised caregiver.</div></div></div></div><div class="btn-row" style="margin-top:19px"><button class="secondary" data-action="call">${ico('phone','tiny')} Call</button><button class="secondary" data-go="updates">${ico('message','tiny')} Message</button></div><p class="fineprint" style="margin-top:19px">Sample profile. Sensitive information and contact details are intentionally not displayed.</p></div>`}
function viewDocuments(){return `<div class="screen"><div class="a-top"><h1 style="font-size:23px;margin:0">Shared documents</h1><button class="circle-btn" data-action="upload" aria-label="Add document">${ico('plus')}</button></div><p class="screen-lede">What you need, when you need it — shared carefully.</p><div class="note-banner" style="margin-bottom:21px">${ico('lock','tiny')} Each document has its own sharing permission. Nothing is public or automatically shared.</div>${sect('Your document spaces')}<button class="soft-card row between" style="width:100%;text-align:left;margin-bottom:10px" data-action="doc-open"><span class="row">${tile('file','lav')}<span><strong style="display:block">Care documents</strong><span class="muted">Private · 2 sample items</span></span></span>${ico('chevron')}</button><button class="soft-card row between" style="width:100%;text-align:left;margin-bottom:10px" data-action="doc-open"><span class="row">${tile('file','peach')}<span><strong style="display:block">Family planning notes</strong><span class="muted">Shared with circle</span></span></span>${ico('chevron')}</button><button class="soft-card row between" style="width:100%;text-align:left;margin-bottom:10px" data-action="doc-open"><span class="row">${tile('file','blue')}<span><strong style="display:block">Appointments</strong><span class="muted">Care coordinators</span></span></span>${ico('chevron')}</button>${sect('Who can see what?','privacy','Manage')}${btn('Review sharing settings','privacy','secondary full')}</div>`}
function viewEmergency(){return `<div class="screen">${topHeader('Emergency information','profile')}<div class="soft-card tint peach" style="margin-bottom:18px"><div class="row">${tile('shield','peach')}<div class="grow"><div class="bold">Here when it matters.</div><div class="muted">Important information for approved people, with clear consent.</div></div></div></div><div class="callout" style="margin-bottom:17px">For an immediate emergency, contact local emergency services. Relay is not a substitute for emergency response.</div>${sect('Family emergency contacts')}<div class="soft-card"><div class="row">${av('JO','dad')}<div class="grow"><div class="bold">Dad</div><div class="muted">Primary contact · Number hidden in demo</div></div>${ico('phone')}</div><hr class="soft-divider"><div class="row">${av('JA','lee')}<div class="grow"><div class="bold">Joy</div><div class="muted">Care coordinator · Number hidden in demo</div></div>${ico('phone')}</div></div>${sect('Protected details')}<div class="soft-card"><div class="row">${tile('lock','lav')}<div class="grow"><div class="bold">Sensitive care notes</div><div class="muted">Not visible without explicit permission</div></div><button class="link-btn" data-action="request-access">Request</button></div></div><div class="note-banner" style="margin-top:18px">${ico('shield','tiny')} This prototype does not store real medical or emergency records.</div></div>`}
function viewPrivacy(){return `<div class="screen">${topHeader('Privacy & sharing','profile')}<span class="eyebrow">YOU'RE IN CONTROL</span><h1 class="screen-title">Your circle. Your boundaries.</h1><p class="screen-lede">Choose what you share. You can change these settings whenever you need to.</p><div class="soft-card"><div class="privacy-item"><div class="grow"><div class="bold">Family updates</div><div class="muted">Allow your circle to see shared updates</div></div><button class="switch ${S.allowPhotos?'on':''}" role="switch" aria-checked="${S.allowPhotos}" data-action="toggle-setting" data-setting="allowPhotos" aria-label="Allow family updates"></button></div><div class="privacy-item"><div class="grow"><div class="bold">Check-in reminders</div><div class="muted">Gentle, optional notifications</div></div><button class="switch ${S.notify?'on':''}" role="switch" aria-checked="${S.notify}" data-action="toggle-setting" data-setting="notify" aria-label="Enable check-in reminders"></button></div><div class="privacy-item"><div class="grow"><div class="bold">Live location sharing</div><div class="muted">Off unless you turn it on</div></div><button class="switch ${S.shareLocation?'on':''}" role="switch" aria-checked="${S.shareLocation}" data-action="toggle-setting" data-setting="shareLocation" aria-label="Enable location sharing"></button></div><div class="privacy-item"><div class="grow"><div class="bold">Care-coordinator access</div><div class="muted">Separate from general family access</div></div><button class="switch ${S.onlyCare?'on':''}" role="switch" aria-checked="${S.onlyCare}" data-action="toggle-setting" data-setting="onlyCare" aria-label="Enable care coordinator access"></button></div></div>${sect('Sharing rules')}<div class="soft-card tint lav"><div class="row">${tile('lock','lav')}<div class="grow"><div class="bold">Sensitive records stay private</div><div class="muted">Approvals and access reviews are required in the real product.</div></div></div></div><p class="fineprint" style="margin-top:17px">These are local interactive prototype controls, not connected to a security backend.</p></div>`}
function viewNotifications(){return `<div class="screen">${topHeader('Notifications','home')}<p class="screen-lede">Useful reminders, without the noise.</p><div class="seg"><button class="selected">All</button><button data-go="calendar">Plans</button><button data-go="updates">Updates</button></div>${[['calendar','Mum’s appointment','Tomorrow · 10:00 AM','Today','blue'],['heart','Joy sent a check-in','Someone is thinking of you','Today','peach'],['checkcircle','Groceries picked up','Dad completed a care task','Yesterday',''],['users','Family circle update','Nan joined the circle','Tuesday','lav']].map(x=>`<div class="notif">${tile(x[0],x[4])}<div class="grow"><div class="bold" style="font-size:13px">${x[1]}</div><div class="muted" style="margin:5px 0">${x[2]}</div><div class="eyebrow" style="font-size:9px">${x[3]}</div></div></div>`).join('')}<div class="note-banner" style="margin-top:22px">${ico('bell','tiny')} You can pause non-essential reminders without missing critical responsibilities.</div></div>`}
function viewProfile(){return `<div class="screen"><div class="a-top"><h1 style="font-size:23px;margin:0">Your space</h1><button class="circle-btn" data-go="notifications">${ico('bell')}</button></div><div class="soft-card tint" style="margin:13px 0 21px"><div class="row">${av('JW','you')}<div class="grow"><div class="bold" style="font-size:17px">Jane Wanjiku</div><div class="muted">Family circle owner</div></div>${ico('chevron')}</div></div>${sect('Your preferences')}${[['shield','Privacy & sharing','See and manage your boundaries','privacy'],['users','Family members','Invitations and roles','circle'],['bell','Notifications','Quiet, useful updates','notifications'],['file','Shared documents','Choose who can access files','documents'],['heart','Emergency information','Important when it matters','emergency'],['help','Accessibility & support','Designed for everyone','empty']].map((x,i)=>`<button class="row between" style="width:100%;border:0;background:transparent;padding:13px 1px;border-bottom:1px solid #e6ebe3;text-align:left" data-go="${x[3]}"><span class="row">${tile(x[0],i%3===1?'lav':i%3===2?'peach':'')}<span><strong style="display:block;font-size:13px">${x[1]}</strong><span class="muted">${x[2]}</span></span></span>${ico('chevron')}</button>`).join('')}<p class="fineprint" style="margin-top:19px">Relay demo 0.1 · Nothing here is sent to a server.</p></div>`}
function viewEmpty(){return `<div class="screen">${topHeader('Gentle empty states','profile')}<div class="centered" style="margin:60px 10px 22px"><div class="big-graphic">${ico('sun','large')}</div><h1 class="screen-title" style="margin-top:25px">Nothing needs you right now.</h1><p class="screen-lede">Sometimes a quiet day is a good day. Your circle is all caught up.</p></div>${btn('Back to your family home','home','primary full')}<div class="note-banner" style="margin-top:27px">${ico('info','tiny')} Relay avoids shame-based messages, urgency theatre and streak mechanics. Errors should explain what happened and offer a clear next step.</div></div>`}
function content(id){switch(id){case 'welcome':return viewWelcome();case 'setup':return viewSetup();case 'invite':return viewInvite();case 'home':return viewHome();case 'calendar':return viewCalendar();case 'tasks':return viewTasks();case 'taskDetail':return viewTaskDetail();case 'checkin':return viewCheckin();case 'updates':return viewUpdates();case 'circle':return viewCircle();case 'member':return viewMember();case 'documents':return viewDocuments();case 'emergency':return viewEmergency();case 'privacy':return viewPrivacy();case 'notifications':return viewNotifications();case 'profile':return viewProfile();case 'empty':return viewEmpty();default:return viewHome()}}
const NO_NAV=['welcome','setup','invite'];const activeNav=id=>['home','tasks','taskDetail','checkin','updates','notifications'].includes(id)?'home':id==='calendar'?'calendar':['circle','member'].includes(id)?'circle':'profile';
function phone(id,interactive=true){return `<div class="phone-screen">${status()}<main class="app-scroll" id="main-content">${content(id)}</main>${NO_NAV.includes(id)?'':nav(activeNav(id))}<div class="phone-footer"><span></span></div>${S.toast?`<div class="toast" role="status">${S.toast}</div>`:''}</div>`}
function sidebar(){let last='';return PAGES.map((x,i)=>`${x.group!==last?(last=x.group,`<div class="sidebar-heading">${x.group}</div>`):''}<button class="page-btn ${S.page===x.id?'active':''}" data-go="${x.id}"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${x.title}</span></button>`).join('')}
function studio(){const page=findPage(S.page);return `<div class="studio"><aside class="sidebar"><div>${logo(false)}</div><p class="subtitle">A calm home for the care we share. Explore Relay's first 17 interface concepts.</p><div class="sidebar-nav">${sidebar()}</div><div class="sidebar-foot"><strong>Design principle</strong><br>Warmth without clutter. Privacy without mystery. Care without pressure.<br><br>Concept prototype · Fictional sample data</div></aside><section class="workspace"><header class="toolbar"><div><span class="overline">Relay / Experience design — v0.1</span><h1 class="project-h1">Care feels closer.</h1></div><div class="toolbar-right"><span class="pill"><b></b> Interactive concept</span><button class="mode-btn" data-action="wall">${ico('users','tiny')} Screen gallery</button></div></header><div class="stage"><div class="stage-copy"><div class="hairline"></div><h2>One circle.<br>Many ways to care.</h2><p>Built for families, caregivers, and trusted loved ones of every generation.</p></div><div class="phone-device" id="primary-phone">${phone(S.page)}</div></div><p class="footer-note">Interactive design prototype using illustrative people and tasks. No actual account, invitations, or sensitive data are saved. <a href="https://github.com/bennhinn/relay" target="_blank" rel="noreferrer">Repository</a></p></section><aside class="right-panel"><div class="brand-sub">Inside this screen</div><h3 id="panel-title">${page.title}</h3><p id="panel-desc">${page.desc}</p><div class="note-panel"><h4>Design intention</h4><p id="intention-text">${getIntention(S.page)}</p></div><div class="section-heading">Relay's visual DNA</div><div class="token-list">${[['#FAF7F2','Ivory'],['#365B4A','Forest'],['#A8BEA5','Sage'],['#DCD3EE','Lavender'],['#F4D3BF','Peach'],['#292D2B','Ink']].map(c=>`<div><div class="swatch" style="background:${c[0]}"></div><div class="swatch-label">${c[1]}</div></div>`).join('')}</div><div class="section-heading">Design materials</div><div class="stacked"><span class="tag">Organic minimalism</span><span class="tag">Subtle glass</span><span class="tag">Soft clay details</span><span class="tag">Quiet elevation</span><span class="tag">Privacy-first UX</span></div><div class="hr"></div><div class="section-heading">Experience principles</div><p>Respect user agency · Plain language · Large tap targets · Adjustable settings · Family structures of all kinds.</p><button class="secondary full" style="margin-top:14px" data-action="wall">View all 17 screens ${ico('arrow','tiny')}</button><p class="preview-note">Select any screen in the left rail to explore.</p></aside></div>`}
const intentions={welcome:'Lead with belonging and reassurance instead of utility lists. The family metaphor uses warm illustrated forms, not childish mascots.',setup:'Use plain, flexible language for a family or care circle; avoid assuming traditional family roles.',invite:'Make role-based access and pending status obvious. Never imply that invitations were actually sent by a prototype.',home:'Show only what matters today. Offer emotional connection next to practical care tasks.',calendar:'Make a predictable, easy-to-scan calendar with readable appointments and permissions.',tasks:'Allow supportive shared responsibilities without public productivity rankings or guilt.',taskDetail:'Clearly show the owner, schedule, sharing audience, and intended next action.',checkin:'Invite emotional check-ins without streaks, judgment, or pressure to reveal feelings.',updates:'Lightweight family stories with clear sharing audiences and deliberate reactions.',circle:'Support diverse family and caregiver relationships without a rigid hierarchy.',member:'Show useful preferences first; keep personal and sensitive information private.',documents:'Explain document access simply and do not pretend a mock UI is a secure vault.',emergency:'Emergency contact details require an explicit access policy, real-world testing, and safe disclosure.',privacy:'Privacy switches are understandable, accessible, and off by default for potentially sensitive access.',notifications:'Prioritize timeliness and relevance; reduce alert fatigue.',profile:'Give people understandable settings with real control over their boundaries.',empty:'Empty states should be reassuring and action-oriented, never shame-based.'};
function getIntention(id){return intentions[id]||'Every screen should be friendly, legible, and trustworthy.'}
function wall(){return `<div class="wall-root"><div class="wall-head"><div><span class="overline">RELAY / COMPLETE UI EXPLORATION</span><h1>Thoughtful by design.</h1><p>17 warm, privacy-aware mobile concepts for the full family and caregiver coordination journey.</p></div><button class="secondary" data-action="studio">${ico('back','tiny')} Back to interactive prototype</button></div><div class="wall-grid">${PAGES.map((x,i)=>`<div class="wall-item"><button data-go="${x.id}" data-view="studio" aria-label="Open ${x.title}"><div class="thumb-shell">${phone(x.id,false)}</div><div class="wall-label">${String(i+1).padStart(2,'0')} / ${x.title}</div><div class="wall-desc">${x.desc}</div></button></div>`).join('')}</div></div>`}
const qs=new URLSearchParams(location.search);let MODE=qs.get('view')==='wall'?'wall':qs.get('view')==='screen'?'screen':'studio';if(qs.get('id')&&PAGES.some(p=>p.id===qs.get('id')))S.page=qs.get('id');
function render(scroll=true){const root=document.getElementById('app');root.innerHTML=MODE==='wall'?wall():MODE==='screen'?`<div class="screen-only"><div class="floating-label"><b>${findPage(S.page).title}</b><span class="small">Relay mobile concept</span></div><button class="float-back" data-action="studio">Back to studio</button><div class="phone-device" id="primary-phone">${phone(S.page)}</div></div>`:studio();if(scroll)window.scrollTo(0,0)}
function showToast(msg){S.toast=msg;const toast=document.querySelector('.toast');if(toast)toast.remove();const phoneNode=document.querySelector('#primary-phone .phone-screen');if(phoneNode){let el=document.createElement('div');el.className='toast';el.role='status';el.textContent=msg;phoneNode.appendChild(el)} }
function goPage(id,view){if(!PAGES.some(x=>x.id===id))return;S.last=S.page;S.page=id;if(view)MODE=view;S.toast='';render(false);const appScroll=document.querySelector('#primary-phone .app-scroll');if(appScroll)appScroll.scrollTop=0;const side=document.querySelector('.sidebar');const chosen=side?.querySelector('.page-btn.active');if(chosen&&window.innerWidth>705)chosen.scrollIntoView({block:'nearest'})}
window.appSetPage=goPage;window.appRender=render;
document.addEventListener('click',e=>{const btn=e.target.closest('[data-go],[data-action]');if(!btn)return;const to=btn.getAttribute('data-go');if(to){goPage(to,btn.getAttribute('data-view'));return}const action=btn.getAttribute('data-action');switch(action){case 'studio':MODE='studio';render();break;case 'wall':MODE='wall';render();break;case 'toggle-task':{const id=btn.dataset.task;S.taskCompleted[id]=!S.taskCompleted[id];render(false);showToast(S.taskCompleted[id]?'Care task marked complete':'Task marked as still needed');break}case 'filter-tasks':S.filter=btn.dataset.filter;render(false);break;case 'toggle-setting':{const k=btn.dataset.setting;S[k]=!S[k];render(false);showToast('Saved for this prototype only — no live account changes');break}case 'choose-day':S.calendarDay=Number(btn.dataset.day);render(false);break;case 'invite':S.inviteStatus=true;render(false);showToast('Invitation preview added. No message was sent.');break;case 'mood':showToast('Selected: '+btn.dataset.mood+' — share only if you choose.');break;case 'send-checkin':S.checkinStatus=true;render(false);showToast('Your check-in was saved in this demo only.');break;case 'add-task':S.taskAdded=true;goPage('tasks');showToast('Demo care task added.');break;case 'prev-month':case 'next-month':showToast('October 2026 is the populated demo month.');break;case 'add-event':showToast('Demo interaction — event creation would open here.');break;case 'upload':showToast('Demo only — no document is uploaded.');break;case 'doc-open':showToast('Document previews need access controls in the real app.');break;case 'request-access':showToast('Prototype only — no access request was sent.');break;case 'call':showToast('Prototype: contact phone number intentionally hidden.');break;case 'react':showToast('Thanks for sharing a little love!');break;case 'add-update':showToast('Family update composer comes in the next sprint.');break;default:showToast('This is an interactive design preview.') }});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-go]')){e.preventDefault();goPage(e.target.dataset.go)}if(e.key==='Escape'&&MODE==='wall'){MODE='studio';render()}});
render();

</script>

<script>
/* RELAY / BLOOM — presentation and additional demo interactions.
   The foundational 17-screen navigation remains in base.js. Demo data is in memory only. */
function leafLogo(){return `<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 25C13 21 10 12 15 4c10-1 16 8 14 17" fill="#94BAA2"/><path d="M24 25C36 21 41 11 33 3c-9 0-15 9-12 20" fill="#ECC6B8"/><path d="M23 25C15 27 13 34 19 42c10 1 16-7 13-16" fill="#75A18A"/></svg>`}
function logo(small=false){return `<span class="${small?'mini-logo':'logo'}" aria-label="relay"><span class="logo-mark">${leafLogo()}</span><span>relay<span style="color:#C9A5A3">.</span></span></span>`}
function floraSVG(){return `<svg class="welcome-botanical" viewBox="0 0 360 330" aria-hidden="true"><path class="stem" d="M26 309Q16 258 55 211 M300 298Q317 251 296 199 M62 314Q90 265 86 234"/><path class="leaf" d="M45 260Q4 247 26 225Q56 225 45 260 M50 240Q44 204 70 209Q79 233 50 240 M306 258Q345 232 346 252Q328 280 306 258 M301 242Q274 222 281 205Q308 210 301 242 M83 264Q106 243 112 260Q99 276 83 264"/><g transform="translate(55 193)"><ellipse class="petal" cx="0" cy="-15" rx="8" ry="15"/><ellipse class="petal" cx="13" cy="-7" rx="8" ry="15" transform="rotate(56 13 -7)"/><ellipse class="petal" cx="9" cy="8" rx="8" ry="15" transform="rotate(105 9 8)"/><ellipse class="petal" cx="-9" cy="8" rx="8" ry="15" transform="rotate(-105 -9 8)"/><ellipse class="petal" cx="-13" cy="-7" rx="8" ry="15" transform="rotate(-56 -13 -7)"/><circle cx="0" cy="0" r="7" fill="#F7D4A3"/></g><g transform="translate(293 174) scale(.81)"><ellipse class="petal-soft" cx="0" cy="-15" rx="8" ry="15"/><ellipse class="petal-soft" cx="13" cy="-7" rx="8" ry="15" transform="rotate(56 13 -7)"/><ellipse class="petal-soft" cx="9" cy="8" rx="8" ry="15" transform="rotate(105 9 8)"/><ellipse class="petal-soft" cx="-9" cy="8" rx="8" ry="15" transform="rotate(-105 -9 8)"/><ellipse class="petal-soft" cx="-13" cy="-7" rx="8" ry="15" transform="rotate(-56 -13 -7)"/><circle cx="0" cy="0" r="7" fill="#F7D4A3"/></g></svg>`}
function homeFlora(){return `<span class="home-flower" aria-hidden="true"><svg viewBox="0 0 85 110"><path d="M79 107Q35 85 56 19" stroke="#89A996" stroke-width="2" fill="none"/><path d="M53 63Q25 48 38 38Q59 38 53 63 M60 43Q78 30 75 19Q56 19 60 43" fill="#9DBEAA"/><g fill="#EAB8BE" transform="translate(53 20)"><ellipse cx="0" cy="-8" rx="6" ry="11"/><ellipse cx="7" cy="1" rx="7" ry="11" transform="rotate(55 7 1)"/><ellipse cx="-7" cy="1" rx="7" ry="11" transform="rotate(-55 -7 1)"/><circle cx="0" cy="0" r="5" fill="#F8DDAD"/></g></svg></span>`}
function viewWelcome(){return `<div class="screen" style="padding-top:18px">${logo(true)}<div style="height:12px"></div><h1 class="welcome-lead">A little care.<br><em>A lot of together.</em></h1><p class="welcome-caption">A calmer place to look after the people who make your world feel like home.</p><div class="welcome-art">${floraSVG()}<div class="family-illustration" aria-label="Stylized illustration of a family together"><span class="person"></span><span class="person"></span><span class="person"></span></div><span class="heart-float">${ico('heart','large')}</span><div class="art-note">made for every kind of family</div></div><div class="welcome-lil-accent">${ico('heart','tiny')} Care feels better together ${ico('heart','tiny')}</div><div style="height:24px"></div>${btn('Get started','setup','primary full')}<p class="fineprint text-center" style="margin-top:18px">Private by design · Gentle by nature</p></div>`}
function relayNav(active){return `<nav class="app-nav" aria-label="App navigation">${[['home','home','Home'],['calendar','calendar','Plans']].map(x=>`<button class="nav-item ${active===x[0]?'selected':''}" data-go="${x[0]}" aria-label="${x[2]}"><span class="nav-ic">${ico(x[1])}</span><span>${x[2]}</span></button>`).join('')}<button class="nav-fab" aria-label="Add care task, event, or update" data-action="quick-add">${ico('plus')}</button>${[['circle','users','Circle'],['profile','user','You']].map(x=>`<button class="nav-item ${active===x[0]?'selected':''}" data-go="${x[0]}" aria-label="${x[2]}"><span class="nav-ic">${ico(x[1])}</span><span>${x[2]}</span></button>`).join('')}</nav>`}
function viewHome(){const count=Object.values(S.taskCompleted).filter(Boolean).length;return `<div class="screen"><div class="a-top">${logo(true)}<button class="circle-btn has-dot" data-go="notifications" aria-label="Notifications">${ico('bell')}</button></div><span class="eyebrow">SUNDAY · 18 OCTOBER</span><h1 class="screen-title" style="font-size:28px;margin-top:8px">Good evening,<br>Wanjiku family <span aria-hidden="true">${ico('sun','sun-accent')}</span></h1><p class="screen-lede">Here's what's happening in your circle.</p><div class="feature-hero">${homeFlora()}<span class="overline">YOUR FAMILY CIRCLE</span><h2>We're better together.</h2><p>Everyone has a place, and every little bit of care matters.</p><div class="member-pills">${av('JW','you')}${av('MW','mom')}${av('JO','dad')}${av('AN','nan')}<button class="mini-add" data-go="invite" aria-label="Invite someone">${ico('plus')}</button></div></div>${sect("Today's focus",'tasks')}<div class="flow-list" style="margin-bottom:22px"><button class="flow-row rose" data-go="taskDetail"><span class="halo-symbol pink">${ico('calendar')}</span><span class="grow"><span class="flow-name">Mum's appointment</span><span class="flow-meta">Tomorrow · 10:00 AM</span></span>${ico('chevron')}</button><button class="flow-row lilac" data-go="tasks"><span class="halo-symbol lav">${ico('checkcircle')}</span><span class="grow"><span class="flow-name">Weekly grocery pickup</span><span class="flow-meta">Today · Assigned to Dad</span></span>${ico('chevron')}</button><button class="flow-row mint" data-go="checkin"><span class="halo-symbol green">${ico('heart')}</span><span class="grow"><span class="flow-name">Check in with Nan</span><span class="flow-meta">A little hello goes a long way</span></span>${ico('chevron')}</button></div><div class="meter-label"><span>This week's care</span><strong>${count} of 4 done</strong></div><div class="progress"><span style="width:${count*25}%"></span></div><div style="height:18px"></div><div class="bloom-card"><div class="row" style="align-items:center;gap:9px"><span class="icon-tile peach">${ico('heart')}</span><div><div class="bold" style="font-size:14px">How's your heart today?</div><div class="muted" style="font-size:11px;margin-top:3px">Take a moment, just for you.</div></div></div><div class="mood-palette">${[['sentiment_very_satisfied','Great'],['sentiment_satisfied','Good'],['sentiment_neutral','Okay'],['sentiment_dissatisfied','Tough']].map(x=>`<button class="mood-chip ${S.mood===x[1]?'picked':''}" data-action="mood-v2" data-mood="${x[1]}" aria-pressed="${S.mood===x[1]}"><span class="mood-symbol">${ico(x[0],'mood-glyph')}</span><span>${x[1]}</span></button>`).join('')}</div><button class="link-btn" style="margin-top:12px;color:#6C7870" data-go="checkin">Add a private note ${ico('arrow','tiny')}</button></div><div class="quiet-banner" style="margin-top:18px">${ico('shield','tiny')} Your family's space, your sharing choices.</div></div>`}
function viewCheckin(){return `<div class="screen">${topHeader('A little check-in','home')}<div style="display:grid;place-items:center;margin:20px 0 17px"><div class="big-graphic" style="margin:0;height:102px;width:102px;border-radius:38px;background:linear-gradient(140deg,#FCE1E0,#E9D9ED)"><span class="heart-line-symbol">${ico('heart','large')}</span></div></div><span class="eyebrow">PAUSE & NOTICE</span><h1 class="screen-title" style="font-size:28px">How's your heart today?</h1><p class="screen-lede">There is no right answer. You can share a little, or keep it just for yourself.</p><div class="mood-choices">${[['sentiment_very_satisfied','Great'],['sentiment_satisfied','Good'],['sentiment_neutral','Okay'],['sentiment_dissatisfied','Tough']].map(x=>`<button class="mood-choice" data-action="mood-v2" data-mood="${x[1]}" aria-pressed="${S.mood===x[1]}"><span class="face">${ico(x[0],'mood-glyph')}</span><small>${x[1]}</small></button>`).join('')}</div><div class="field"><label for="checkin-note">Add a note (optional)</label><textarea id="checkin-note" class="input" placeholder="What's on your mind? You can leave this blank.">${S.checkinDraft||''}</textarea></div><div class="field"><label for="checkin-audience">Who can see this?</label><select id="checkin-audience" class="input"><option ${S.audience==='My whole family circle'?'selected':''}>My whole family circle</option><option ${S.audience==='Care coordinators only'?'selected':''}>Care coordinators only</option><option ${S.audience==='Only me (private journal)'?'selected':''}>Only me (private journal)</option></select></div>${S.checkinStatus?`<div class="note-banner" style="margin-bottom:12px">${ico('check','tiny')} Your check-in has been saved in this preview.</div>`:''}<button class="primary full" data-action="save-checkin-v2">${ico('heart','tiny')} Save check-in ${ico('arrow','tiny')}</button><div class="soft-card tint lav" style="margin-top:16px"><div class="row" style="gap:10px"><span class="icon-tile lav">${ico('heart')}</span><div class="muted">You're not alone. Small moments of care make a difference.</div></div></div></div>`}
function viewTasks(){const all=[['medicine',"Mum's appointment",'Tomorrow · 10:00 AM · Joy'],['groceries','Weekly grocery pickup','Today · Dad'],['forms','Fill insurance renewal','Thursday · You'],['call','Call grandma','Completed · Yesterday'],...(S.demoTasks||[]).map(t=>[t.id,t.name,t.date+' · '+t.person])].filter(x=>S.filter==='All'||(S.filter==='Done'?S.taskCompleted[x[0]]:!S.taskCompleted[x[0]]));const completed=Object.values(S.taskCompleted).filter(Boolean).length;const total=Object.keys(S.taskCompleted).length;return `<div class="screen"><div class="a-top"><h1 style="font-size:25px;margin:0">Care tasks</h1><button class="circle-btn" data-action="open-task-dialog" aria-label="Create new care task">${ico('plus')}</button></div><p class="screen-lede">Little responsibilities, shared with love.</p><div class="soft-card tint" style="padding:20px;position:relative;overflow:hidden">${homeFlora()}<div class="row between"><div><div class="eyebrow">THIS WEEK</div><div style="font-family:Georgia,serif;font-size:30px;color:var(--pine);margin-top:7px">${completed} / ${total} <span class="small">complete</span></div></div>${tile('checkcircle')}</div><div class="progress" style="margin-top:18px"><span style="width:${completed/total*100}%"></span></div></div><div class="seg" style="margin-top:23px">${['All','To do','Done'].map(x=>`<button class="${S.filter===x?'selected':''}" data-action="filter-tasks" data-filter="${x}">${x}</button>`).join('')}</div>${sect('Our shared to-dos')}${all.map(x=>tcard(...x)).join('')||`<div class="soft-card centered">${ico('checkcircle','large')}<p>Nothing to do here. You're all caught up.</p></div>`}<div class="note-banner" style="margin-top:17px">${ico('heart','tiny')} Care is a shared act, not a competition. You can always ask for help.</div></div>`}
function viewCalendar(){const month=S.calendarMonth,year=2026;const monthName=new Intl.DateTimeFormat('en-GB',{month:'long'}).format(new Date(year,month,1));const days=new Date(year,month+1,0).getDate(),start=(new Date(year,month,1).getDay()+6)%7;return `<div class="screen"><div class="a-top"><h1 style="font-size:25px;margin:0">Family calendar</h1><button class="circle-btn" data-action="open-event-dialog" aria-label="Add event">${ico('plus')}</button></div><p class="screen-lede">A place for everything that matters.</p><div class="row between" style="margin:19px 0 15px"><h2 style="font-family:Georgia,serif;font-size:21px;margin:0">${monthName} ${year}</h2><div class="row" style="gap:10px"><button class="circle-btn" data-action="calendar-prev-v2" aria-label="Previous month">${ico('back','tiny')}</button><button class="circle-btn" data-action="calendar-next-v2" aria-label="Next month">${ico('chevron','tiny')}</button></div></div><div class="soft-card" style="padding:14px 12px"><div class="calendar-grid">${['M','T','W','T','F','S','S'].map(x=>`<span class="calcell day">${x}</span>`).join('')}${Array.from({length:start},()=>`<span class="calcell"></span>`).join('')}${Array.from({length:days},(_,i)=>`<button data-action="choose-day" data-day="${i+1}" class="calcell ${i+1===S.calendarDay?'active':(i+1)%7===4?'has':''}" style="border:0">${i+1}</button>`).join('')}</div><div class="note-banner">${ico('calendar','tiny')} ${S.calendarDay} ${monthName} selected. Events are visible based on your permissions.</div></div>${sect('Coming up')}${(S.demoEvents||[]).map(e=>`<button class="flow-row lilac" data-action="show-event-v2" data-index="${(S.demoEvents||[]).indexOf(e)}"><span class="halo-symbol lav">${ico('calendar')}</span><span class="grow"><span class="flow-name">${escapeRelay(e.name)}</span><span class="flow-meta">${escapeRelay(e.date)}</span></span>${ico('chevron')}</button>`).join('')}<div class="timeline"><div class="timeline-card"><span class="eyebrow">19 OCT · 10:00 AM</span><div class="bold" style="margin:7px 0">Mum's clinic appointment</div><div class="muted">Joy is coordinating · Family-only</div></div><div class="timeline-card"><span class="eyebrow">24 OCT · ALL DAY</span><div class="bold" style="margin:7px 0">Grandma's birthday ${ico('cake','tiny')}</div><div class="muted">Everyone in your circle</div></div><div class="timeline-card"><span class="eyebrow">28 OCT · 2:00 PM</span><div class="bold" style="margin:7px 0">Family catch-up call</div><div class="muted">Online · 4 invited</div></div></div></div>`}
function escapeRelay(str){return String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openRelayDialog(kind){const existing=document.getElementById('relay-dialog');if(existing)existing.remove();const isTask=kind==='task',title=kind==='quick'?'Add a little care':isTask?'Create a care task':'Add a family event';const inner=kind==='quick'?`<div class="quick-actions"><button data-quick="task">${ico('checkcircle')} Add a care task</button><button data-quick="event">${ico('calendar')} Add a calendar event</button><button data-quick="update">${ico('message')} Share a family update</button></div>`:`<form id="relay-dialog-form" autocomplete="off"><label for="relay-title">${isTask?'Task':'Event'} title</label><input id="relay-title" name="name" placeholder="${isTask?'e.g. Pick up prescriptions':'e.g. Family dinner'}" required maxlength="80"><label for="relay-date">${isTask?'When':'Date and time'}</label><input id="relay-date" name="date" type="datetime-local" value="2026-10-19T10:00" required>${isTask?`<label for="relay-person">Who is helping?</label><select name="person" id="relay-person"><option>You</option><option>Mum</option><option>Dad</option><option>Joy</option><option>Nan</option></select>`:''}<button class="primary sheet-submit" type="submit">Save to prototype ${ico('arrow','tiny')}</button></form>`;const shell=document.createElement('div');shell.className='detail-dialog';shell.id='relay-dialog';shell.innerHTML=`<section class="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="relay-dialog-title"><button class="dialog-dismiss" data-close-dialog aria-label="Close dialog">${ico('back')}</button><span class="eyebrow">A LITTLE MORE TOGETHER</span><h2 id="relay-dialog-title">${title}</h2><p>Make a plan, invite help, and keep everyone in the loop.</p>${inner}</section>`;document.body.appendChild(shell);shell.dataset.kind=kind;shell.querySelector('input,button[data-quick],.dialog-dismiss')?.focus()}
nav=relayNav;
S.mood=S.mood||null;S.demoTasks=S.demoTasks||[];S.demoEvents=S.demoEvents||[];S.checkinDraft=S.checkinDraft||'';S.audience=S.audience||'My whole family circle';
document.addEventListener('click',event=>{const el=event.target.closest('[data-action],[data-quick],[data-close-dialog]');if(event.target.id==='relay-dialog'||el?.hasAttribute('data-close-dialog')){document.getElementById('relay-dialog')?.remove();event.preventDefault();event.stopImmediatePropagation();return}if(!el)return;const action=el.dataset.action;if(el.dataset.quick){const kind=el.dataset.quick;document.getElementById('relay-dialog')?.remove();if(kind==='update'){goPage('updates');showToast('Select a post to explore family updates. The composer is planned for the next sprint.')}else openRelayDialog(kind);event.preventDefault();event.stopImmediatePropagation();return}
if(['quick-add','open-task-dialog','open-event-dialog','add-task','add-event','mood-v2','save-checkin-v2','calendar-prev-v2','calendar-next-v2','show-event-v2'].includes(action)){event.preventDefault();event.stopImmediatePropagation();switch(action){case 'quick-add':openRelayDialog('quick');break;case 'open-task-dialog':case 'add-task':openRelayDialog('task');break;case 'open-event-dialog':case 'add-event':openRelayDialog('event');break;case 'mood-v2':S.mood=el.dataset.mood;render(false);showToast('Feeling '+S.mood.toLowerCase()+' today. You choose what to share.');break;case 'save-checkin-v2':S.checkinDraft=document.querySelector('#checkin-note')?.value||'';S.audience=document.querySelector('#checkin-audience')?.value||'Only me (private journal)';S.checkinStatus=true;render(false);showToast('Saved in your private demo session.');break;case 'calendar-prev-v2':S.calendarMonth=(S.calendarMonth+11)%12;S.calendarDay=1;render(false);break;case 'calendar-next-v2':S.calendarMonth=(S.calendarMonth+1)%12;S.calendarDay=1;render(false);break;case 'show-event-v2':{const entry=S.demoEvents[Number(el.dataset.index)];showToast(entry?entry.name+' · '+entry.date:'Event');break}}}},true);
document.addEventListener('submit',event=>{if(event.target.id!=='relay-dialog-form')return;event.preventDefault();const form=new FormData(event.target),name=String(form.get('name')||'').trim(),dateString=String(form.get('date')||'');if(!name||!dateString)return;const date=new Date(dateString);const formatted=isNaN(date.getTime())?dateString:date.toLocaleString('en-KE',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});const kind=document.getElementById('relay-dialog')?.dataset.kind;if(kind==='task'){const id='custom-'+(S.demoTasks.length+1);S.taskCompleted[id]=false;S.demoTasks.push({id,name,date:formatted,person:String(form.get('person')||'You')});goPage('tasks');}else{S.demoEvents.push({name,date:formatted});goPage('calendar');}document.getElementById('relay-dialog')?.remove();showToast((kind==='task'?'Care task':'Event')+' added for this session.');},true);
document.addEventListener('keydown',event=>{if(event.key==='Escape')document.getElementById('relay-dialog')?.remove()});
render(false);

</script>
</body></html>
